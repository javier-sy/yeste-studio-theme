# yeste.studio news: the one newsletter of yeste.studio, for every site. The theme reads this file and
# scripts/sync-news.sh copies it to yeste-studio-website, so the list lives in one place.
#
# `endpoint` empty: no signup form and no newsletter section in the privacy policies. Setting it
# turns both on in every site (after sync-news.sh and a rebuild). Moving the list to another
# service means changing `endpoint`, `email_field` and `processor`, nothing else.
name: yeste.studio news
# The heading of the signup form; `name` names the newsletter elsewhere (privacy, letters)
title: "Subscribe to the yeste.studio newsletter:"
endpoint: https://buttondown.com/api/emails/embed-subscribe/yeste.studio
email_field: email
# The same text on every site, naming every field the letters cover (the news topics, in
# _data/topics.yml); the closing words leave room for what comes next and for letters of
# reflection. A new product can join the list when it is published.
pitch: Works, shows and talks, what's new in MusaDSL, MusaLCE and Nota, and whatever else yeste.studio is working on - in a few letters a year.
button: Subscribe
fine: Confirm by email · Unsubscribe anytime · Opens in a new tab

# For the privacy policies (Spanish, like the legal pages). Check `tracking` in the service's
# settings when the account opens: false means the letters measure neither opens nor clicks.
tracking: false
processor:
  name: Buttondown, LLC
  address: "406 W Franklin St. #201, Richmond, VA 23221, Estados Unidos"
  privacy: https://buttondown.com/legal/privacy
  transfer: las cláusulas contractuales tipo aprobadas por la Comisión Europea (Decisión de Ejecución (UE) 2021/914)
